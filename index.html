<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta
      name="description"
      content="Expense Analytics - personal and business expense intelligence with forecasting, anomaly detection and spend controls."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Expense Analytics</title>
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('ea-theme');
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
